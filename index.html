<!DOCTYPE html> <!-- specifies html5 (backwards compatibility [bc]) -->

<html lang="en"> <!-- same thing -->

  <head> <!-- for unseen parts of the page -->
    <meta charset="UTF-8"> <!-- specifies modern encoding standard [bc] -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- on mobile, does not treat as desktop page [bc] -->
    <title>Time Tracker</title> <!-- webpage tab title -->
    <link rel="stylesheet" href="styles.css">
  </head>

  <body> <!-- main part of the page -->

    <div class="layout">

      <aside class="sidebar"> <!-- navigation bar of page -->
        <p class="dashboard">Dashboard</p>
        <div class="navigation">
          <a id="assignments" href="index.html">Assignments</a>
          <a id="misc">Misc</a>
        </div>
        <img class="settings-icon" src="assets/settings-new.png" height="60" width="60">
      </aside>

      <div class="content">
        <header>
          <h1>Assignment Tracker v2</h1>
          <div class="clock">
            <div class="clock-inner"><div id="seconds"></div></div>
          </div>
        </header>
        
        <main>
          <div class="top-row">
            <button class="add-button" data-action="add">Add New</button>
          </div>
          <div class="countdown-grid" id="js-countdown-grid">
            <!-- countdowns go here -->
          </div>
        </main>
      </div>

    </div>
    <script src="index.js"></script>
  </body>

</html>
