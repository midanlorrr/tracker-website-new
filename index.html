<!DOCTYPE html> <!-- specifies html5 (backwards compatibility [bc]) -->

<html lang="en"> <!-- same thing -->

  <head> <!-- for unseen parts of the page -->
    <meta charset="UTF-8"> <!-- specifies modern encoding standard [bc] -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- on mobile, does not treat as desktop page [bc] -->
    <title>Time Tracker</title> <!-- webpage tab title -->
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/rebirth.png">
  </head>

  <body> <!-- main part of the page -->

    <div class="layout">

      <aside class="sidebar"> <!-- navigation bar of page -->
        <p class="dashboard">Dashboard</p>
        <div class="navigation">
          <button id="all">All</button>
          <button id="assignments">Assignments</button>
          <button id="misc">Misc</button>
        </div>
        <img class="settings-icon" src="assets/rebirth.png" height="40" width="40">
      </aside>

      <div class="content">
        <header>
          <h1>Assignment Tracker v2</h1>
          <div class="clock">
            <div class="clock-inner"><div id="seconds"></div></div>
          </div>
        </header>
        
        <main>
          <div class="top-row">
            <button class="add-button" data-action="add">Add New</button>
            <button class="export-button" data-action="export">Export</button>
            <input data-action="data-input" type="text" value="Input data if needed">
          </div>
          <div class="countdown-grid" id="js-countdown-grid">
            <!-- countdowns go here -->
          </div>
          <textarea id="export-box" readonly style="width:100%;height:180px;display:none;"></textarea>
        </main>
      </div>

    </div>
    <script src="index.js"></script>
  </body>

</html>
